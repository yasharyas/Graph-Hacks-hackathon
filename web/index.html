<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patient Zero</title>
    <meta
      name="description"
      content="Patient Zero turns an npm supply-chain alert into an answer in seconds: which repos are exposed, through which dependency path, and which team owns the fix."
    />
    <!-- Link previews (Slack, LinkedIn, X): a title, a sentence and a 1200x630 card that is a screenshot of the app itself (the
         1440px landing at the end of its autoplay, scaled: real counts, the brand fonts; re-render it if the landing changes).
         The image path is relative until the deploy sets the absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Patient Zero war room for the qix npm compromise: 21 repos one install from malware, the first OSV record 74 minutes after the first exposure, and the dependency paths from the hijacked account to each repo." />
    <meta property="og:site_name" content="Patient Zero" />
    <meta property="og:title" content="Patient Zero: which repos are one install from a hijacked npm package" />
    <meta
      property="og:description"
      content="An npm supply-chain war room on FalkorDB: from an alert to the exposed repos, the dependency path to each, and who owns the fix, before the advisory exists."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-card.png" />
    <meta name="twitter:image:alt" content="The Patient Zero war room for the qix npm compromise: 21 repos one install from malware, the first OSV record 74 minutes after the first exposure, and the dependency paths from the hijacked account to each repo." />
    <meta name="twitter:title" content="Patient Zero: which repos are one install from a hijacked npm package" />
    <meta
      name="twitter:description"
      content="An npm supply-chain war room on FalkorDB: from an alert to the exposed repos, the dependency path to each, and who owns the fix, before the advisory exists."

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e5383b'/%3E%3C/svg%3E" />
    <!-- The swap window should be a frame, not a second (docs/design.md section 3): the two faces above the fold first,
         then the display face ("74 min", drawer titles). The metric-matched fallbacks in tokens.css keep the swap from
         shifting the layout when it does take longer than a frame. -->
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/MartianMono-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/CabinetGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Patient Zero needs JavaScript to run the war room.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
